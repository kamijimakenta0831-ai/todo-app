<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ToDo</title>
</head>
<body>
  <h1>ToDo</h1>

  <input id="title" placeholder="タイトル">
  <input id="parent" placeholder="親のid（空でもOK）">
  <button onclick="addTask()">追加</button>
  <button onclick="loadTasks()">一覧取得</button>

  <div id="list"></div>

  <script>
    const API = "http://127.0.0.1:8000";

    function makeRow(t, depth) {
      const row = document.createElement("div");
      row.style.marginLeft = (depth * 24) + "px";
      row.textContent = t.id + ": " + t.title + " [" + t.status + "] ";
      const btn = document.createElement("button");
      if (t.status === "完了") {
        row.style.textDecoration = "line-through";
        row.style.color = "gray";
        btn.textContent = "未完了に戻す";
        btn.onclick = () => setStatus(t.id, "未完了");
      } else {
        btn.textContent = "完了にする";
        btn.onclick = () => setStatus(t.id, "完了");
      }
      row.appendChild(btn);

      const del = document.createElement("button");
      del.textContent = "削除";
      del.onclick = () => deleteTask(t.id);
      row.appendChild(del);

      return row;
    }

    function drawTasks(tasks, parentId, depth) {
      const list = document.getElementById("list");
      tasks.filter(t => t.parent_id === parentId).forEach(t => {
        list.appendChild(makeRow(t, depth));
        drawTasks(tasks, t.id, depth + 1);
      });
    }

    function loadTasks() {
      fetch(API + "/tasks")
        .then(res => res.json())
        .then(tasks => {
          document.getElementById("list").innerHTML = "";
          drawTasks(tasks, null, 0);
        });
    }

    function addTask() {
      const titleBox = document.getElementById("title");
      const parentBox = document.getElementById("parent");

      const title = titleBox.value.trim();
      if (title === "") {
        alert("タイトルを入れてください");
        return;
      }

      const parentId = parentBox.value === "" ? null : Number(parentBox.value);
      fetch(API + "/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: title, parent_id: parentId }),
      }).then(() => {
        titleBox.value = "";
        loadTasks();
      });
    }

    function setStatus(id, status) {
      fetch(API + "/tasks/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: status }),
      }).then(() => loadTasks());
    }

    function deleteTask(id) {
      if (!confirm(id + "番を削除します。子も全部消えます。よいですか？")) {
        return;
      }
      fetch(API + "/tasks/" + id, {
        method: "DELETE",
      }).then(() => loadTasks());
    }

    loadTasks();
  </script>
</body>
</html>
