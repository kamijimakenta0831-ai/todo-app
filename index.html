<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ToDo</title>
</head>
<body>
  <h1>ToDo</h1>

  <input id="title" placeholder="タイトル">
  <input id="parent" placeholder="親のid（空でもOK）">
  <button onclick="addTask()">追加</button>
  <button onclick="loadTasks()">一覧取得</button>

  <div id="list"></div>

  <script>
    const API = "http://127.0.0.1:8000";

    // 1行分の表示を作る。depth（深さ）の分だけ左に空白を入れる
    function makeRow(t, depth) {
      const row = document.createElement("div");
      row.style.marginLeft = (depth * 24) + "px";
      row.textContent = t.id + ": " + t.title + " [" + t.status + "] ";
      if (t.status !== "完了") {
        const btn = document.createElement("button");
        btn.textContent = "完了にする";
        btn.onclick = () => completeTask(t.id);
        row.appendChild(btn);
      }
      return row;
    }

    // parentId を親に持つタスクを並べ、そのすぐ下に、その子たちも並べる
    function drawTasks(tasks, parentId, depth) {
      const list = document.getElementById("list");
      tasks.filter(t => t.parent_id === parentId).forEach(t => {
        list.appendChild(makeRow(t, depth));
        drawTasks(tasks, t.id, depth + 1);
      });
    }

    function loadTasks() {
      fetch(API + "/tasks")
        .then(res => res.json())
        .then(tasks => {
          document.getElementById("list").innerHTML = "";
          drawTasks(tasks, null, 0);
        });
    }

    function addTask() {
      const title = document.getElementById("title").value;
      const parentText = document.getElementById("parent").value;
      const parentId = parentText === "" ? null : Number(parentText);
      fetch(API + "/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: title, parent_id: parentId }),
      }).then(() => loadTasks());
    }

    function completeTask(id) {
      fetch(API + "/tasks/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "完了" }),
      }).then(() => loadTasks());
    }

    loadTasks();
  </script>
</body>
</html>
